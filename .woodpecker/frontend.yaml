clone:
  git:
    image: docker.io/woodpeckerci/plugin-git:2.9.2
    settings:
      partial: false
      depth: 0

when:
  - event: push
    branch: main

concurrency: 1

steps:
  - name: prepare-dagger
    image: ghcr.io/tta-lab/dagger-cli:0.21.7@sha256:ed228ba0add728881a81ba4a58914921d76e9ccdc00287a8214651f909edd784
    commands:
      - cp "$(command -v dagger)" .git/dagger-ci
  - name: build
    image: node:24.18.1-bookworm@sha256:19cd848a0e073d34bd8cd5545a1b6b4d28489b3e3b607366621ced442bd5f6b4
    environment:
      _EXPERIMENTAL_DAGGER_RUNNER_HOST: tcp://10.42.0.1:18081
    commands:
      - |
        set -eu
        test -n "$${CI_COMMIT_SHA}"
        node --test tests/frontend-dagger-entry.test.mjs
        DAGGER_BIN="$${PWD}/.git/dagger-ci" sh scripts/build-frontend-dagger.sh
  - name: publish
    image: oven/bun:1.3.14@sha256:e10577f0db68676a7024391c6e5cb4b879ebd17188ab750cf10024a6d700e5c4
    environment:
      FORGEJO_PACKAGES_TOKEN:
        from_secret: forgejo_packages_token
      GITHUB_RELEASE_TOKEN:
        from_secret: github_release_token
    commands:
      - bun scripts/publish-frontend.mjs "$${CI_COMMIT_SHA}" "lamplit-app-$${CI_COMMIT_SHA}.tar.gz"
